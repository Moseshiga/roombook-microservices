server.address=0.0.0.0
server.port=8080

spring.datasource.url=jdbc:postgresql://postgres:5432/bookings_db
spring.datasource.username=booking
spring.datasource.password=booking_local

# The browser-facing Keycloak issuer stays localhost; only the JWK fetch uses Docker DNS.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/roombook
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/roombook/protocol/openid-connect/certs

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.instance.hostname=booking-service

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=roombook
spring.rabbitmq.password=${RABBITMQ_PASSWORD:roombook_local}
spring.rabbitmq.connection-timeout=3s

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://zipkin:9411/api/v2/spans
