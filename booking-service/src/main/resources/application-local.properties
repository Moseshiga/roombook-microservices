# Development only. Activate a different profile and provide datasource settings for deployment.
server.address=127.0.0.1
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/bookings_db}
spring.datasource.username=${DB_USERNAME:booking}
spring.datasource.password=${DB_PASSWORD:booking_local}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/roombook}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:roombook}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:roombook_local}
spring.rabbitmq.connection-timeout=3s
