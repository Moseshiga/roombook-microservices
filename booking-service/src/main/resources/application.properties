spring.application.name=booking-service
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

spring.flyway.enabled=true
booking.expiration.cleanup.enabled=true
booking.expiration.cleanup-interval=PT1M
booking.outbox.publisher.enabled=true
booking.outbox.publisher.interval=PT5S
booking.outbox.cleanup.enabled=true
booking.outbox.cleanup.interval=PT1H
booking.outbox.cleanup.retention=PT720H
booking.outbox.cleanup.batch-size=500

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.observation-enabled=true

management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]\u0020
logging.include-application-name=false

management.endpoint.health.show-details=never

# Bound the blocking Feign call before it can occupy a servlet thread indefinitely.
spring.cloud.openfeign.client.config.room-service.connect-timeout=${ROOM_SERVICE_CONNECT_TIMEOUT:1000}
spring.cloud.openfeign.client.config.room-service.read-timeout=${ROOM_SERVICE_READ_TIMEOUT:1500}

# One client request may make at most two safe GET attempts. The circuit breaker
# observes the final result of that logical lookup, not each individual attempt.
resilience4j.retry.instances.roomCatalog.max-attempts=2
resilience4j.retry.instances.roomCatalog.wait-duration=200ms
resilience4j.retry.instances.roomCatalog.retry-exception-predicate=dev.roombooking.booking.room.TransientRoomCatalogFailurePredicate

resilience4j.circuitbreaker.instances.roomCatalog.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.roomCatalog.sliding-window-size=10
resilience4j.circuitbreaker.instances.roomCatalog.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.roomCatalog.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.roomCatalog.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.roomCatalog.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.roomCatalog.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.roomCatalog.record-exception-predicate=dev.roombooking.booking.room.TransientRoomCatalogFailurePredicate

# These endpoints expose state and metrics without adding the circuit breaker to
# the service health result: an OPEN dependency circuit means degraded, not dead.
management.endpoints.web.exposure.include=health,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents
