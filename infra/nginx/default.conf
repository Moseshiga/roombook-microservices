server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Swagger UI is hosted by booking-service and aggregates the three OpenAPI documents.
    location = /swagger-ui.html { proxy_pass http://booking-service:8080; }
    location /swagger-ui/ { proxy_pass http://booking-service:8080; }
    location = /v3/api-docs/swagger-config { proxy_pass http://booking-service:8080; }
    location = /v3/api-docs/booking { proxy_pass http://booking-service:8080/v3/api-docs; }
    location = /v3/api-docs/rooms { proxy_pass http://room-service:8082/v3/api-docs; }
    location = /v3/api-docs/profile { proxy_pass http://profile-service:8084/v3/api-docs; }

    location = /api/bookings { proxy_pass http://booking-service:8080; }
    location /api/bookings/ { proxy_pass http://booking-service:8080; }

    location = /api/rooms { proxy_pass http://room-service:8082; }
    location /api/rooms/ { proxy_pass http://room-service:8082; }
    location = /api/admin/rooms { proxy_pass http://room-service:8082; }
    location /api/admin/rooms/ { proxy_pass http://room-service:8082; }

    location = /api/profile { proxy_pass http://profile-service:8084; }
    location /api/profile/ { proxy_pass http://profile-service:8084; }

    # ADMIN-only booking-service diagnostics, for example
    # /actuator/booking/circuitbreakers and /actuator/booking/metrics.
    location /actuator/booking/ { proxy_pass http://booking-service:8080/actuator/; }

    location / { return 404; }
}
