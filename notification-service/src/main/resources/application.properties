spring.application.name=notification-service
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

spring.flyway.enabled=true

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.retry.stateless=true
spring.rabbitmq.listener.simple.observation-enabled=true

notification.inbox.cleanup.enabled=true
notification.inbox.cleanup.interval=PT1H
notification.inbox.cleanup.retention=PT2160H
notification.inbox.cleanup.batch-size=500

notification.profile.grpc.deadline=PT2S
spring.grpc.client.channel.profile-service.target=static://localhost:9090
spring.grpc.client.channel.profile-service.ssl.enabled=false

management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]\u0020
logging.include-application-name=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
